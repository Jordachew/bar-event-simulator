<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nichole turns 33</title>
<meta name="description" content="A birthday road trip from Kingston to Negril. Photo challenges, a wall of wishes, and a year worth celebrating.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffd0e1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nichole 33">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest" id="manifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Fraunces:opsz,wght,SOFT@9..144,700..800,0..100&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff4f8; --card:#ffffff; --text:#4a1d36; --muted:#8b5d74; --line:#f8d5e3;
  --hero:#ffd0e1; --hero-text:#4a1d36;
  --brand:#c9285f; --brand-text:#ffffff; --brand-soft:#ffe3ee; --hot:#ff5f9e; --pink:#ff9ec3;
  --lilac:#efe4ff; --gold:#f4c46a; --leaf:#2f8f6b;
  --sea:#e6f0ff; --land:#ffd3e3; --land-line:#ffffff;
  --shadow:0 2px 0 rgba(201,40,95,.05),0 10px 28px rgba(201,40,95,.12);
  --script:"Dancing Script","Brush Script MT",cursive;
  --display:"Fraunces",Georgia,"Times New Roman",serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --nav-h:64px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#22101b; --card:#321626; --text:#ffe9f1; --muted:#d6a7bd; --line:#5a2a43;
    --hero:#3a1730; --hero-text:#ffe9f1;
    --brand:#ff7fae; --brand-text:#3a0b21; --brand-soft:#4a2036; --hot:#ff7fae; --pink:#ff9ec3;
    --lilac:#3a2650; --sea:#2a1a3a; --land:#5a2a4d; --land-line:#8a4a78;
    --shadow:0 2px 0 rgba(0,0,0,.2),0 10px 28px rgba(0,0,0,.3);
  }
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{background:var(--bg);color:var(--text);font:500 16px/1.5 var(--body);min-height:100vh;
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 34px);-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
img{display:block;max-width:100%}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:10px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1,h2,h3{font-family:var(--script);font-weight:700;line-height:1.05}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}

/* top bar */
.bar{position:sticky;top:0;z-index:20;background:var(--hero);color:var(--hero-text);padding:calc(env(safe-area-inset-top) + 8px) 16px 8px}
.bar-in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:10px}
.bar-title{font:700 28px/1 var(--script);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#fff;color:var(--brand);font-size:18px;box-shadow:0 2px 0 rgba(201,40,95,.18);transition:transform .15s}
.icon-btn:active{transform:scale(.9)}
@media (prefers-color-scheme:dark){.icon-btn{background:var(--card)}}
.net{display:none;background:var(--gold);color:#3a2800;font-size:13px;font-weight:700;text-align:center;padding:4px 12px}
.net.on{display:block}

/* hero */
.hero{background:var(--hero);color:var(--hero-text);padding:6px 0 44px;position:relative}
.hero::after{content:"";position:absolute;left:0;right:0;top:100%;height:14px;
  background:radial-gradient(circle at 14px 0,var(--hero) 13px,transparent 13.5px) 0 0/28px 14px repeat-x}
.hero-in{max-width:640px;margin:0 auto;padding:0 16px;display:grid;grid-template-columns:1fr 46%;gap:6px;align-items:end;position:relative}
.hero-copy{padding-bottom:6px;min-width:0}
.hero-name{font:700 27px/1.05 var(--script);margin-top:8px}
button.hero-33{display:block;font-family:var(--display);font-variation-settings:"SOFT" 100,"opsz" 144,"WONK" 1;font-weight:800;
  font-size:clamp(104px,34vw,168px);line-height:.84;letter-spacing:-.04em;color:var(--hot);margin:6px 0 14px -4px;text-align:left;
  text-shadow:-3px -3px 0 #fff,3px -3px 0 #fff,-3px 3px 0 #fff,3px 3px 0 #fff,0 7px 0 var(--brand),0 12px 20px rgba(201,40,95,.35);
  transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
button.hero-33:active{transform:scale(.94) rotate(-3deg)}
.hero-tag{font-size:15px;line-height:1.45;max-width:26ch;font-weight:600}
.polaroid{background:#fff;padding:8px 8px 34px;border-radius:8px;transform:rotate(3deg);box-shadow:0 14px 30px rgba(201,40,95,.28);margin:16px 4px 0 0;position:relative;cursor:pointer}
.polaroid img{width:100%;aspect-ratio:4/5;object-fit:cover;object-position:50% 30%;border-radius:3px;background:#f3d7e2}
.polaroid .cap{position:absolute;left:0;right:0;bottom:7px;text-align:center;color:#6b2a4a;font:700 21px/1 var(--script)}
.tape{position:absolute;top:-11px;left:50%;width:78px;height:22px;transform:translateX(-50%) rotate(-5deg);
  background:repeating-linear-gradient(45deg,#ffb3cf 0 6px,#ffd9e6 6px 12px);opacity:.92;border-radius:2px}
.polaroid.wiggle{animation:wig .6s}
@keyframes wig{0%,100%{transform:rotate(3deg)}20%{transform:rotate(-5deg) scale(1.03)}45%{transform:rotate(7deg)}70%{transform:rotate(-2deg)}}
.bow{color:var(--brand);display:block}
.bow-l{position:absolute;right:calc(46% - 40px);top:6px;z-index:3;width:60px;height:auto;transform:rotate(-14deg);filter:drop-shadow(0 3px 0 rgba(201,40,95,.2))}
.bow-s{position:absolute;right:14px;top:-18px;width:52px;height:auto;transform:rotate(10deg);filter:drop-shadow(0 2px 0 rgba(201,40,95,.2))}

/* status */
.status{margin:30px 16px 0;position:relative;z-index:2}
.status-in{max-width:608px;margin:0 auto;background:var(--card);border-radius:26px;padding:20px 20px 18px;box-shadow:var(--shadow);border:2px solid var(--line);position:relative}
.status h2{font-size:30px;margin-bottom:2px;color:var(--brand)}
.status p{color:var(--muted);font-size:15px;font-weight:600}
.hearts{display:flex;flex-wrap:wrap;gap:3px;margin-top:12px}
.hrt{font-size:21px;line-height:1;color:var(--line)}
.hrt.on{color:var(--hot);animation:pop .5s cubic-bezier(.3,1.6,.5,1)}

/* sections */
section.blk{margin-top:28px}
section.blk>h2{font-size:34px;margin-bottom:6px;color:var(--brand)}
.lead{color:var(--muted);margin:0 0 12px;font-weight:600}
.card{background:var(--card);border:2px solid var(--line);border-radius:24px;box-shadow:var(--shadow)}
.pad{padding:16px}

/* map */
.map{overflow:hidden}
.map svg{display:block;width:100%;height:auto;background:var(--sea)}
.map .island{fill:var(--land);stroke:var(--land-line);stroke-width:6;stroke-linejoin:round}
.map .road-base{fill:none;stroke:var(--brand);stroke-width:5;stroke-dasharray:1 12;stroke-linecap:round;opacity:.5}
.map .road-done{fill:none;stroke:var(--hot);stroke-width:8;stroke-linecap:round}
.map .stop-ring{fill:#fff;stroke:var(--brand);stroke-width:5}
.map .stop-done{fill:var(--hot)}
.map .pin{cursor:pointer}
.map .pin .hit{fill:transparent}
.map .pin.next .stop-ring{animation:pulse 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{50%{transform:scale(1.35)}}
.map text.lbl{font:800 30px var(--body);fill:var(--text);paint-order:stroke;stroke:var(--sea);stroke-width:8px;stroke-linejoin:round;pointer-events:none}
.map .bus-ring{fill:#fff;stroke:var(--brand);stroke-width:5}
#bus{animation:bob 1.5s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
.map-foot{display:flex;justify-content:space-between;gap:8px;padding:12px 16px;font-size:14px;color:var(--muted);font-weight:700;border-top:2px solid var(--line)}

/* challenges */
.stop-h{display:flex;align-items:baseline;gap:10px;margin:24px 0 10px;scroll-margin-top:80px}
.stop-h h3{font-size:30px;color:var(--brand)}
.stop-h small{color:var(--muted);font-size:14px;font-weight:700}
.ch{display:grid;grid-template-columns:50px 1fr;gap:12px;padding:14px;margin-bottom:12px;align-items:start}
.ch .em{width:50px;height:50px;border-radius:18px;background:var(--brand-soft);display:grid;place-items:center;font-size:27px}
.ch.done .em{background:var(--hot);color:#fff;font-weight:800}
.ch h4{font:800 17px/1.25 var(--body)}
.ch p{color:var(--muted);font-size:15px;margin-top:2px;font-weight:600}
.ch .shot{margin-top:10px;position:relative;border-radius:18px;overflow:hidden;background:var(--line);border:3px solid #fff;box-shadow:0 6px 16px rgba(201,40,95,.18)}
.ch .shot img{width:100%;max-height:420px;object-fit:cover;cursor:zoom-in}
.ch .cap{font-size:15px;margin-top:8px;font-weight:600}
.ch.wrapped{display:block;padding:6px;border:2.5px dashed var(--pink);background:repeating-linear-gradient(135deg,var(--card) 0 14px,var(--brand-soft) 14px 28px)}
.gift{display:flex;gap:14px;align-items:center;width:100%;text-align:left;padding:10px;border-radius:18px}
.gift-em{font-size:42px;line-height:1;animation:wob 2.4s ease-in-out infinite;display:inline-block}
@keyframes wob{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg) scale(1.08)}}
.gift b{display:block;font-size:17px;font-weight:800}
.gift small{color:var(--muted);font-size:14px;font-weight:700}
.ch.locked{opacity:.85;border-style:dashed}
.ch.reveal{animation:pop .6s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{0%{transform:scale(.9);opacity:.4}60%{transform:scale(1.04)}100%{transform:none;opacity:1}}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:99px;background:var(--brand);color:var(--brand-text);font-weight:800;font-size:15px;box-shadow:0 4px 0 rgba(90,10,45,.35);transition:transform .12s,box-shadow .12s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(90,10,45,.35)}
.btn.ghost{background:#fff;color:var(--brand);border:2px solid var(--pink);box-shadow:0 3px 0 rgba(201,40,95,.15)}
@media (prefers-color-scheme:dark){.btn.ghost{background:var(--card)}}
.btn.small{min-height:38px;padding:0 15px;font-size:14px}
.btn.big{min-height:56px;padding:0 30px;font-size:18px}
.btn[disabled]{opacity:.55;pointer-events:none}
.waiting{font-size:14px;color:var(--muted);margin-top:8px;font-weight:600}
.like{display:inline-flex;align-items:center;gap:6px;min-height:42px;padding:0 14px;border-radius:99px;border:2px solid var(--line);font-weight:800;font-size:15px;color:var(--muted);background:var(--card);transition:transform .15s}
.like:active{transform:scale(.9)}
.like[aria-pressed="true"]{background:var(--brand-soft);border-color:var(--hot);color:var(--brand)}
.like[aria-pressed="true"] svg{animation:pop .45s cubic-bezier(.3,1.7,.5,1)}
.like svg{width:19px;height:19px}
.when{font-size:13px;color:var(--muted);font-weight:600}

/* wall */
.composer{padding:16px;display:grid;gap:10px}
.field{width:100%;border:2px solid var(--line);background:var(--bg);border-radius:16px;padding:12px 14px;min-height:48px;font-weight:600}
textarea.field{min-height:96px;resize:vertical}
.field:focus{outline:none;border-color:var(--hot)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none;margin:0 -2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:38px;padding:0 14px;border-radius:99px;background:var(--brand-soft);color:var(--brand);font-weight:800;font-size:14px;border:2px solid transparent;transition:transform .12s}
.chip:active{transform:scale(.93);border-color:var(--hot)}
.preview{position:relative;border-radius:16px;overflow:hidden;max-height:260px}
.preview img{width:100%;max-height:260px;object-fit:cover}
.preview button{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff}
.post{padding:16px;margin-bottom:14px}
.post.her{background:var(--lilac)}
.post-h{display:flex;gap:12px;align-items:center;margin-bottom:8px}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--pink);color:#5a1034;display:grid;place-items:center;font:700 24px var(--script);flex:none;border:2px solid #fff}
.post.her .avatar{background:var(--brand);color:var(--brand-text)}
.post-h b{display:block;line-height:1.2;font-weight:800}
.post-body{white-space:pre-wrap;overflow-wrap:anywhere;font-weight:600}
.post-img{margin-top:10px;border-radius:18px;overflow:hidden;border:3px solid #fff;box-shadow:0 6px 16px rgba(201,40,95,.15)}
.post-img img{width:100%;max-height:480px;object-fit:cover;cursor:zoom-in}
.tag{display:inline-block;font-size:13px;font-weight:800;background:var(--brand-soft);color:var(--brand);border-radius:99px;padding:2px 11px;margin-bottom:6px}
.empty{text-align:center;color:var(--muted);padding:28px 16px;font-weight:700}
.link-btn{color:var(--muted);font-size:13px;text-decoration:underline;padding:6px;font-weight:600}

/* year */
.wins{display:grid;gap:14px}
.win{display:grid;grid-template-columns:64px 1fr;gap:14px;padding:16px;align-items:center}
.win .winph{grid-column:1/-1;margin-top:0}
.win .winph img{max-height:520px;object-position:50% 40%}
.win .big{font-size:36px;width:64px;height:64px;border-radius:20px;background:var(--brand-soft);display:grid;place-items:center}
.win h3{font-size:30px;color:var(--brand)}
.win p{color:var(--muted);font-size:15px;font-weight:600}
.mem{columns:2;column-gap:12px}
.mem figure{break-inside:avoid;margin:0 0 12px;border-radius:18px;overflow:hidden;background:#fff;border:2px solid var(--line);padding:6px 6px 0;box-shadow:var(--shadow)}
.mem figure:nth-child(odd){transform:rotate(-1.2deg)}
.mem figure:nth-child(even){transform:rotate(1.2deg)}
.mem img{width:100%;border-radius:12px;cursor:zoom-in}
.mem figcaption{padding:8px 6px 10px;font:700 19px/1.1 var(--script);color:#6b2a4a}
.wish-img{padding:10px}
.wish-img img{width:100%;border-radius:16px;cursor:zoom-in}

/* nav */
nav.tabs{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 10px);z-index:30;background:var(--card);border:2px solid var(--line);border-radius:30px;padding:5px;box-shadow:0 10px 28px rgba(201,40,95,.2);max-width:616px;margin:0 auto}
nav.tabs ul{list-style:none;display:flex;gap:4px}
nav.tabs li{flex:1}
nav.tabs button{width:100%;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border-radius:24px;color:var(--muted);font-size:12.5px;font-weight:800;transition:background .2s,color .2s,transform .15s}
nav.tabs button:active{transform:scale(.93)}
nav.tabs button svg{width:23px;height:23px}
nav.tabs button[aria-current="page"]{color:var(--brand-text);background:var(--brand)}

/* sheet + modal */
.scrim{position:fixed;inset:0;background:rgba(74,20,50,.55);z-index:50;display:none;align-items:flex-end;justify-content:center}
.scrim.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:640px;border-radius:30px 30px 0 0;padding:20px 18px calc(env(safe-area-inset-bottom) + 20px);max-height:88vh;overflow:auto;animation:up .3s cubic-bezier(.2,1.2,.3,1)}
@keyframes up{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
.sheet h2{font-size:34px;margin-bottom:8px;color:var(--brand)}
.sheet p{color:var(--muted);margin-bottom:12px;font-weight:600}
.sheet .grab{width:44px;height:5px;border-radius:99px;background:var(--line);margin:-8px auto 14px}
.pop-emoji{font-size:52px;margin-bottom:2px;animation:wob 1.6s ease-in-out infinite;display:inline-block}
.lightbox{position:fixed;inset:0;background:rgba(40,8,25,.94);z-index:60;display:none;place-items:center;padding:12px}
.lightbox.on{display:grid}
.lightbox img{max-width:100%;max-height:92vh;border-radius:10px}
.lightbox button{position:absolute;top:calc(env(safe-area-inset-top) + 10px);right:12px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.2);color:#fff;font-size:20px}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 28px);transform:translate(-50%,20px);background:var(--brand);color:var(--brand-text);padding:12px 20px;border-radius:99px;font-weight:800;z-index:70;opacity:0;transition:.25s;max-width:calc(100% - 32px);text-align:center;pointer-events:none;box-shadow:0 6px 18px rgba(201,40,95,.35)}
.toast.on{opacity:1;transform:translate(-50%,0)}
canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:80}
.fh{position:fixed;z-index:90;pointer-events:none;font-size:22px;animation:fh 1.1s ease-out forwards}
@keyframes fh{from{transform:translate(0,0) scale(.6);opacity:1}to{transform:translate(var(--dx),-110px) scale(1.25) rotate(var(--r));opacity:0}}
.sp{position:fixed;z-index:90;pointer-events:none;color:var(--hot);font-size:15px;animation:sp .65s ease-out forwards}
@keyframes sp{to{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0}}

/* welcome */
.welcome{position:fixed;inset:0;z-index:100;background:var(--hero);color:var(--hero-text);display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:14px}
.welcome.on{display:flex}
.wbow{width:min(72vw,300px);height:auto;color:var(--brand);animation:bobbow 2.2s ease-in-out infinite;filter:drop-shadow(0 8px 0 rgba(201,40,95,.2))}
@keyframes bobbow{50%{transform:translateY(-10px) rotate(3deg)}}
.wtitle{font-size:clamp(44px,13vw,64px)}
.welcome p{max-width:28ch;font-weight:700;font-size:17px}

/* push card */
.pushcard{display:grid;grid-template-columns:46px 1fr;gap:12px;padding:14px;margin-top:18px;align-items:start}
.pushcard .em{font-size:28px;width:46px;height:46px;display:grid;place-items:center;background:var(--brand-soft);border-radius:14px}
.pushcard h3{font-size:28px;color:var(--brand)}
.pushcard p{color:var(--muted);font-size:15px;margin-top:2px;font-weight:600}
.pushcard ol{margin:8px 0 0 18px;color:var(--muted);font-size:15px;font-weight:600}

/* admin */
.adm{display:grid;gap:10px;padding:14px;margin-bottom:12px}
.adm .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.adm label{font-size:13px;font-weight:800;color:var(--muted);display:block;margin-bottom:3px}
.adm h3{font-size:28px;color:var(--brand)}
.mini{font-size:13px;color:var(--muted);font-weight:600}
.sent{color:var(--leaf);font-weight:800;font-size:13px}

@media (min-width:700px){.hero-in{grid-template-columns:1fr 280px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<noscript><p style="padding:24px">This page needs JavaScript to show Nichole's birthday road trip.</p></noscript>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><g id="bow">
  <path d="M60 40C42 8 4 8 7 38c2 26 36 26 53 2z" fill="currentColor"/>
  <path d="M60 40c18-32 56-32 53-2-2 26-36 26-53 2z" fill="currentColor"/>
  <path d="M22 26c8-6 20-4 28 8-12-2-22-2-28-8z" fill="#fff" fill-opacity=".28"/>
  <path d="M98 26c-8-6-20-4-28 8 12-2 22-2 28-8z" fill="#fff" fill-opacity=".28"/>
  <path d="M52 48L34 76l17-6 8-18z" fill="currentColor"/><path d="M68 48l18 28-17-6-8-18z" fill="currentColor"/>
  <path d="M52 48L34 76l17-6 8-18z M68 48l18 28-17-6-8-18z" fill="#000" fill-opacity=".14"/>
  <rect x="49" y="28" width="22" height="24" rx="10" fill="currentColor"/>
  <rect x="49" y="28" width="22" height="24" rx="10" fill="#000" fill-opacity=".1"/>
  <ellipse cx="57" cy="36" rx="4" ry="6" fill="#fff" fill-opacity=".3"/>
</g></defs></svg>
<div class="welcome" id="welcome" role="dialog" aria-modal="true" aria-labelledby="wtitle"></div>
<header class="bar">
  <div class="bar-in">

function placeMap(){

/* photos */
function loadImg(file){
  return new Promise((res, rej) => { const u = URL.createObjectURL(file), i = new Image();
    i.onload = () => res({i, u}); i.onerror = () => { URL.revokeObjectURL(u); rej(new Error("Couldn't read that photo. Try a JPG or PNG.")); }; i.src = u; });
}
async function compress(file){
  const {i, u} = await loadImg(file); const max = 1600, k = Math.min(1, max / Math.max(i.naturalWidth, i.naturalHeight));
  const c = document.createElement("canvas"); c.width = Math.round(i.naturalWidth * k); c.height = Math.round(i.naturalHeight * k);
  c.getContext("2d").drawImage(i, 0, 0, c.width, c.height); URL.revokeObjectURL(u);
  return new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error("Couldn't prepare that photo.")), "image/jpeg", .82));
}
async function uploadPhoto(file){
  const blob = await compress(file);
  for (let tries = 0; tries < 2; tries++){
    const path = `p/${rid(18)}.jpg`;
    try{
      const r = await fetch(`${SB}/storage/v1/object/bday-photos/${path}`, {method:"POST", headers:{apikey:AK, Authorization:"Bearer " + AK, "Content-Type":"image/jpeg"}, body:blob});
      if (r.ok) return path;
    }catch(_){}
  }
  throw new Error("Photo upload failed. Check your signal and try again.");
}

function seenSet(){ try{ return new Set(JSON.parse(store.get("b_seen") || "[]")); }catch(_){ return new Set(); } }
function checkPopups(){
  if (sheetOpen || !S.loaded) return;
  const now = Date.now(), seen = seenSet();
  const aud = S.role === "her" ? ["her", "all"] : ["guests", "all"];
  const due = S.schedule.filter(r => aud.includes(r.audience) && new Date(r.send_at).getTime() <= now && now - new Date(r.send_at).getTime() < 3 * 36e5 && !seen.has(r.id));
  if (!due.length) return;
  const r = due[due.length - 1]; due.forEach(x => seen.add(x.id)); store.set("b_seen", JSON.stringify([...seen].slice(-80)));
  const em = (r.title.match(/\p{Extended_Pictographic}/u) || ["💗"])[0], title = r.title.replace(/\p{Extended_Pictographic}️?/gu, "").trim();
  sheet(`<div class="grab"></div><div class="pop-emoji" aria-hidden="true">${em}</div><h2>${esc(title)}</h2><p>${esc(r.body)}</p>
    <div class="row"><button class="btn" data-act="popOpen" data-url="${esc(r.url || "")}">Take me there</button><button class="btn ghost" data-act="closeSheet">Later</button></div>`);
  if (!reduceMotion && S.role === "her") burst(26);
  if (navigator.vibrate) try{ navigator.vibrate([80, 40, 80]); }catch(_){}
}

/* ───────── push ───────── */
const b64 = s => { const p = "=".repeat((4 - s.length % 4) % 4), r = (s + p).replace(/-/g, "+").replace(/_/g, "/"), raw = atob(r); return Uint8Array.from([...raw].map(c => c.charCodeAt(0))); };
async function enablePush(){
  if (!pushOK) return toast(isIOS ? "Add this app to your Home Screen first, then tap the bell." : "This browser can't receive pings.");
  try{
    const perm = await Notification.requestPermission();
    if (perm !== "granted"){ renderDyn(); return toast("Pings are off. You can allow them in your phone settings."); }
    await subscribePush(true); renderDyn();
    toast("Pings are on!"); burst(14);
  }catch(e){ toast("Couldn't turn on pings: " + (e.message || "try again")); }
}
async function subscribePush(){
  const reg = await navigator.serviceWorker.ready;
  let sub = await reg.pushManager.getSubscription();
  if (!sub){ const pub = await rpc("bday_vapid"); sub = await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:b64(pub)}); }
  const j = sub.toJSON();
  await rpc("bday_save_sub", {p_endpoint:j.endpoint, p_p256dh:j.keys.p256dh, p_auth:j.keys.auth, p_device:S.dev, p_key:S.key});
}
function bellState(){
  const on = pushOK && Notification.permission === "granted";
  const b = $("#btnBell"); b.textContent = on ? "🔔" : "🔕"; b.setAttribute("aria-label", on ? "Birthday pings are on" : "Turn on birthday pings");
}
$("#btnBell").onclick = () => {
  if (pushOK && Notification.permission === "granted") return toast("Pings are on.");
  if (S.tab !== "journey") go("journey");
  else { const c = $(".pushcard"); if (c) c.scrollIntoView({behavior:"smooth", block:"center"}); }
  if (pushOK && Notification.permission === "default" && !(isIOS && !standalone)) enablePush();
};

/* ───────── confetti ───────── */
function burst(n = 70){
  if (reduceMotion) return;
  const c = $("#fx"), x = c.getContext("2d"), dpr = devicePixelRatio || 1;
  c.width = innerWidth * dpr; c.height = innerHeight * dpr; x.scale(dpr, dpr);
  const cols = ["#ff5f9e", "#c9285f", "#f4c46a", "#ffc2d8", "#efe4ff", "#ffffff", "#ff9ec3"];
  const ps = Array.from({length:n}, () => ({x:innerWidth / 2 + (Math.random() - .5) * 120, y:innerHeight * .6, vx:(Math.random() - .5) * 11, vy:-Math.random() * 14 - 5, r:Math.random() * 6 + 3, a:Math.random() * 6, va:(Math.random() - .5) * .4, c:cols[Math.random() * cols.length | 0]}));
  let t = 0;
  (function f(){
    x.clearRect(0, 0, innerWidth, innerHeight);
    ps.forEach(p => { p.vy += .42; p.x += p.vx; p.y += p.vy; p.a += p.va; x.save(); x.translate(p.x, p.y); x.rotate(p.a); x.fillStyle = p.c; x.fillRect(-p.r, -p.r / 2, p.r * 2, p.r); x.restore(); });
    if (++t < 90) requestAnimationFrame(f); else x.clearRect(0, 0, innerWidth, innerHeight);
  })();
}

/* ───────── girlie extras ───────── */
function floatHearts(x, y, n = 6){
  if (reduceMotion) return;
  const set = ["💗", "💖", "🎀", "✨", "💕", "🌸"];
  for (let i = 0; i < n; i++){
    const s = document.createElement("span"); s.className = "fh"; s.textContent = set[Math.random() * set.length | 0];
    s.style.left = x + (Math.random() - .5) * 40 + "px"; s.style.top = y + "px";
    s.style.setProperty("--dx", (Math.random() - .5) * 120 + "px"); s.style.setProperty("--r", (Math.random() - .5) * 50 + "deg");
    s.style.animationDelay = i * 60 + "ms"; document.body.appendChild(s); setTimeout(() => s.remove(), 1400 + i * 60);
  }
}
let taps33 = 0;
const SAYS33 = ["Happy birthday, " + "Nichole! 🎀", "Thirty-three and thriving ✨", "Tap tap tap, we see you 😂", "Okay, birthday queen 👑", "Fine, one more 💗"];
function tap33(el){
  const r = el.getBoundingClientRect(); burst(55); floatHearts(r.left + r.width / 2, r.top + r.height / 2, 9);
  toast(SAYS33[taps33++ % SAYS33.length].replace("Nichole", herName()));
}
document.addEventListener("pointerdown", e => {
  if (reduceMotion || /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  for (let i = 0; i < 5; i++){
    const s = document.createElement("span"); s.className = "sp"; s.textContent = i % 2 ? "✦" : "♡";
    s.style.left = e.clientX + "px"; s.style.top = e.clientY + "px";
    const a = Math.random() * 6.28, d = 24 + Math.random() * 30;
    s.style.setProperty("--dx", Math.cos(a) * d + "px"); s.style.setProperty("--dy", Math.sin(a) * d + "px");
    document.body.appendChild(s); setTimeout(() => s.remove(), 700);
  }
}, {passive:true});
function maybeWelcome(){
  if (!isHer() || store.get("b_welcomed")) return;
  const w = $("#welcome");
  w.innerHTML = `<svg class="wbow" viewBox="0 0 120 80" aria-hidden="true"><use href="#bow"/></svg>
    <h1 id="wtitle" class="wtitle">Happy birthday, ${esc(herName())}</h1>
    <p>Your road trip is ready, with little surprises waiting along the way.</p>
    <button class="btn big" id="wopen">Open your gift</button>`;
  w.classList.add("on");
  $("#wopen").onclick = () => { store.set("b_welcomed", "1"); w.classList.remove("on"); burst(110); floatHearts(innerWidth / 2, innerHeight / 2, 12); };
  $("#wopen").focus();
}

/* ───────── role + boot ───────── */
async function initRole(){
  const q = new URLSearchParams(location.search).get("k");
  if (q){ store.set("b_k", q); history.replaceState(null, "", location.pathname + location.hash); }
  S.key = store.get("b_k") || "";
  if (!S.key){ S.role = "guest"; return; }
  try{
    const r = await rpc("bday_role", {p_key:S.key});
    if (r === "guest"){ store.del("b_k"); S.key = ""; }
    S.role = r; store.set("b_role", r);
  }catch(_){ S.role = store.get("b_role") || "guest"; }
}
function applyManifestKey(){
  // Lets the Home Screen icon reopen with the signed-in link (iOS keeps separate storage for installed apps).
  if (!S.key || S.role === "guest") return;
  try{
    const base = location.origin + location.pathname.replace(/[^/]*$/, "");
    const m = {name:"Nichole turns 33", short_name:"Nichole 33", start_url:base + "?k=" + encodeURIComponent(S.key), scope:base, display:"standalone", orientation:"portrait",
      background_color:"#ffd0e1", theme_color:"#ffd0e1",
      icons:[{src:base + "icon-192.png", sizes:"192x192", type:"image/png"}, {src:base + "icon-512.png", sizes:"512x512", type:"image/png"}, {src:base + "icon-maskable-512.png", sizes:"512x512", type:"image/png", purpose:"maskable"}]};
    $("#manifest").href = URL.createObjectURL(new Blob([JSON.stringify(m)], {type:"application/manifest+json"}));
  }catch(_){}
}
addEventListener("online", () => refresh());
addEventListener("offline", () => setNet(true));
addEventListener("hashchange", () => { const t = location.hash.slice(1); if (t && t !== S.tab) go(t); });
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
if ("serviceWorker" in navigator){
  navigator.serviceWorker.addEventListener("message", e => { if (e.data && e.data.type === "goto"){ const h = (e.data.url.split("#")[1] || "journey"); go(h); refresh(); } });
}
(async function boot(){
  await initRole();
  applyManifestKey();
  S.tab = location.hash.slice(1) || "journey";
  if (S.tab === "admin" && S.role !== "admin") S.tab = "journey";
  const cached = loadCache();
  renderTabs(); renderMain();
  try{ await loadAll(); }catch(_){ setNet(true); if (!cached) $("#main").innerHTML = '<div class="wrap" style="padding-top:40px"><div class="card empty">Can\'t reach the app right now. Check your signal and reopen.</div></div>'; }
  renderMain(); checkPopups(); maybeWelcome();
  if ("serviceWorker" in navigator){
    try{ await navigator.serviceWorker.register("sw.js"); if (pushOK && Notification.permission === "granted") subscribePush().catch(() => {}); }catch(_){}
  }
  setInterval(() => { if (!document.hidden) refresh(); }, 25000);
  setInterval(() => { if (S.tab === "journey" && S.loaded && !document.hidden){ const st = $("#status"); if (st) st.innerHTML = statusHTML(); } }, 30000);
})();
</script>
